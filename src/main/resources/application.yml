spring:
  application:
    name: saborja-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

server:
  port: ${PORT:8080}

---
# Perfil de desenvolvimento: H2 em memória, schema recriado a cada execução
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:saborja;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

---
# Perfil de produção: PostgreSQL; credenciais vêm de variáveis de ambiente (RNF10)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saborja}
    username: ${DB_USER:saborja}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
