services:
  postgres:
    image: postgres:16-alpine
    container_name: saborja-postgres
    environment:
      POSTGRES_DB: saborja
      POSTGRES_USER: saborja
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saborja_dev}
    ports:
      - "5432:5432"
    volumes:
      - saborja-data:/var/lib/postgresql/data

volumes:
  saborja-data:
